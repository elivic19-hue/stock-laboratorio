        RECONOCIDO EN EL MÓVIL · 0,3 s

  <section aria-label="Resultado" style="flex: 1; margin-top: -20px; border-radius: 20px 20px 0 0; background: #FFFFFF; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">

      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B636B">RACK 96 UDS · ARM. 2 · BALDA 3</span>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #D9DCD6; border-radius: 10px">

      </div>
      <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: #F3F4F1; border-radius: 0 10px 10px 0">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #5B636B">TRAS RETIRAR</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">11 <span style="font-size: 12px; color: #5B636B; font-weight: 400">racks</span></span>
      </div>
    </div>

      <span style="font-size: 15px; font-weight: 500">Cantidad</span>
      <div style="display: flex; align-items: center; border: 1px solid #D9DCD6; border-radius: 10px">
        <button aria-label="Restar uno" style="width: 48px; height: 46px; border: none; background: transparent; font: inherit; font-size: 22px; color: #15181B">−</button>
        <span style="width: 44px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; border-left: 1px solid #D9DCD6; border-right: 1px solid #D9DCD6; line-height: 46px">1</span>
        <button aria-label="Sumar uno" style="width: 48px; height: 46px; border: none; background: transparent; font: inherit; font-size: 22px; color: #15181B">+</button>

    </div>

    <button style="height: 52px; border: none; border-radius: 12px; background: #2340B8; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600">Confirmar retirada</button>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #5B636B">¿NO ES ESTE?</span>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border: 1px solid #D9DCD6; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #15181B; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">Puntas 200 µL <span style="font-family: 'IBM Plex Mono', monospace; color: #5B636B">71 %</span></button>

    </div>
