<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>A pedir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2340B8}a:hover{color:#182F8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15181B; overflow: hidden">

  <header style="padding: 28px 20px 14px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9A3B0B">4 BAJO MÍNIMO</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">A pedir</h1>
    </div>
    <button style="height: 40px; padding: 0 14px; border: 1px solid #D9DCD6; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; color: #15181B; display: flex; align-items: center; gap: 8px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 9l5-5 5 5M5 15v5h14v-5"/></svg>
      Compartir lista
    </button>
  </header>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #D9DCD6; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 500">{{item.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B636B">{{item.ref}}</span>
          </div>
          <button style="flex-shrink: 0; height: 36px; padding: 0 12px; border: 1px solid #15181B; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; color: #15181B">Marcar pedido</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #E4E6E1; padding-top: 8px">
          <div style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #5B636B">QUEDAN</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; color: #9A3B0B">{{item.qty}} <span style="font-size: 11px; font-weight: 400">{{item.unit}}</span></span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #5B636B">MÍNIMO</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500">{{item.min}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #5B636B">SUGERIDO</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500">{{item.order}}</span>
          </div>
        </div>
      </article>
    </sc-for>

    <div style="display: flex; justify-content: space-between; padding: 12px 0 6px; border-bottom: 1px solid #D9DCD6">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #5B636B">PEDIDOS EN CURSO</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B636B">2</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 0">
      <span style="font-size: 14px">Guantes nitrilo talla M</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B636B">PEDIDO 14 NOV</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 0">
      <span style="font-size: 14px">Filtros jeringa PTFE 0,45 µm</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B636B">PEDIDO 17 NOV</span>
    </div>
  </div>

  <nav aria-label="Navegación principal" style="height: 84px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; background: #FFFFFF; border-top: 1px solid #D9DCD6; padding-top: 8px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B636B; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>
      Stock
    </a>
    <a href="Pedir.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #15181B; font-size: 11px; font-weight: 600; min-height: 44px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
      A pedir
      <span style="position: absolute; top: -4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #B4470F; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">4</span>
    </a>
    <a href="Retirar.dc.html" aria-label="Retirar con foto" style="justify-self: center; margin-top: -30px; width: 64px; height: 64px; border-radius: 32px; background: #2340B8; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #F3F4F1">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </a>
    <a href="Entrada.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B636B; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Entrada
    </a>
    <a href="Producto.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B636B; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h6v6H5zM13 5h6v6h-6zM5 13h6v6H5zM13 13h6v6h-6z"/></svg>
      Catálogo
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Etanol absoluto 1 L', ref: 'ARM. INFLAMABLES · B2', qty: 1, unit: 'bot.', min: 3, order: 6 },
        { name: 'Puntas pipeta 200 µL', ref: 'ARM. 2 · B3', qty: 4, unit: 'racks', min: 5, order: 10 },
        { name: 'Tapones rosca 9 mm PTFE', ref: 'ARM. 2 · B1', qty: 150, unit: 'uds', min: 200, order: 500 },
        { name: 'Ácido acético 3 %', ref: 'ARM. ÁCIDOS · B1', qty: 2, unit: 'bid.', min: 2, order: 4 }
      ]
    };
  }
}
</script>
</body>
</html>
