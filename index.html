<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // viewport-fit=cover solo en iPhone/iPad (zona de la barra de inicio, que iOS sí descuenta con
      // env(safe-area-inset-bottom)). En Android, Chrome dibuja entonces la app instalada por debajo
      // de la barra de navegación del sistema sin descontarla, y el final de la pantalla queda tapado.
      ;(function () {
        var agente = navigator.userAgent
        var ios = /iPhone|iPad|iPod/.test(agente) || (/Macintosh/.test(agente) && navigator.maxTouchPoints > 1)
        if (!ios) document.getElementById('viewport').setAttribute('content', 'width=device-width, initial-scale=1')
      })()
    </script>
    <title>Stock del laboratorio</title>
    <meta name="description" content="Control de stock de reactivos y material fungible del laboratorio." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="./icono.svg" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stock lab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Evita que iOS convierta lotes y códigos en enlaces de teléfono -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
